<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <div class="layout">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">

      <!-- Header card -->
      <section class="card card--accent">
        {{HEADER}}
      </section>

      <!-- Skills -->
      <section class="card">
        {{SKILLS}}
      </section>

      <!-- Education -->
      <section class="card">
        {{EDUCATION}}
      </section>

    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main">

      <!-- Profile -->
      <section class="card">
        {{PROFILE}}
      </section>

      <!-- Experience -->
      <section class="card">
        {{EXPERIENCE}}
      </section>

      <!-- Community -->
      <section class="card">
        {{COMMUNITY}}
      </section>

    </main>
  </div>
</div>

</body>
</html>
