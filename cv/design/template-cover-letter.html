<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="style-cover-letter.css">
</head>
<body>

<!-- Same header and typography as the CV (template.html) so both documents read as a set. -->
<div class="page">
  <main class="resume">

    <header class="letterhead">
      {{HEADER}}
    </header>

    <section class="letter">
      <!-- {{BODY}} expects <p class="salutation">, <p> paragraphs and <p class="signoff"> -->
      {{BODY}}
    </section>

    <footer class="signature">
      <p class="signature__name">{{SIGNATURE}}</p>
    </footer>

  </main>
</div>

</body>
</html>
